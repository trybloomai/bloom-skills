<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#111827" flood-opacity="0.10"/></filter>
    <marker id="arrowGray" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#9CA3AF"/></marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#8B5CF6"/></marker>
    <style>
      text{font-family:Inter,Arial,sans-serif}.title{font-size:30px;font-weight:700;fill:#111827}.subtitle{font-size:16px;fill:#6B7280}.eyebrow{font-size:13px;font-weight:700;letter-spacing:.4px}.cardtitle{font-size:17px;font-weight:700;fill:#111827}.body{font-size:15px;fill:#4B5563}.paneltitle{font-size:18px;font-weight:700}.stacktitle{font-size:15px;font-weight:700}.stackbody{font-size:14px}.small{font-size:13px}.arrow{fill:none;stroke:#9CA3AF;stroke-width:2;marker-end:url(#arrowGray)}
    </style>
  </defs>
  <rect width="1600" height="1000" fill="#F7F8FC"/>
  <text x="60" y="63" class="title">How the model ‘remembers’ an image after its pixels leave context</text>
  <text x="62" y="99" class="subtitle">The API is stateless: every model call is rebuilt by replaying selected conversation messages.</text>
  <rect x="45" y="125" width="1510" height="360" rx="14" fill="#FFF" stroke="#E5E7EB" filter="url(#shadow)"/>
  <text x="70" y="162" class="eyebrow" fill="#7C3AED">WHAT IS REPLAYED OVER TIME</text>
  <path d="M320 310 H365" class="arrow"/><path d="M620 310 H665" class="arrow"/><path d="M920 310 H965" class="arrow"/><path d="M1220 310 H1265" class="arrow"/>
  <g transform="translate(70 190)"><rect width="250" height="240" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="2"/><text x="18" y="32" class="eyebrow" fill="#2563EB">VIEW</text><text x="18" y="76" class="cardtitle"><tspan x="18">Image pixels enter</tspan><tspan x="18" dy="23">the transcript</tspan></text><text x="18" y="145" class="body"><tspan x="18">view_files returns the</tspan><tspan x="18" dy="21">image bytes plus path</tspan><tspan x="18" dy="21">and type.</tspan></text></g>
  <g transform="translate(370 190)"><rect width="250" height="240" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="2"/><text x="18" y="32" class="eyebrow" fill="#2563EB">NEXT 3 MODEL CALLS</text><text x="18" y="76" class="cardtitle"><tspan x="18">Pixels are still</tspan><tspan x="18" dy="23">replayed</tspan></text><text x="18" y="145" class="body"><tspan x="18">The model can inspect</tspan><tspan x="18" dy="21">the source again while</tspan><tspan x="18" dy="21">it reasons and uses tools.</tspan></text></g>
  <g transform="translate(670 190)"><rect width="250" height="240" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="2"/><text x="18" y="32" class="eyebrow" fill="#059669">ASSISTANT MESSAGE</text><text x="18" y="76" class="cardtitle"><tspan x="18">The model writes</tspan><tspan x="18" dy="23">observations</tspan></text><text x="18" y="145" class="body"><tspan x="18">Example: “dark terminal</tspan><tspan x="18" dy="21">UI, acid-green accent,</tspan><tspan x="18" dy="21">serif wordmark.”</tspan></text></g>
  <g transform="translate(970 190)"><rect width="250" height="240" rx="14" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="2"/><text x="18" y="32" class="eyebrow" fill="#6B7280">4TH SUBSEQUENT CALL</text><text x="18" y="76" class="cardtitle"><tspan x="18">Old pixels are</tspan><tspan x="18" dy="23">evicted</tspan></text><text x="18" y="145" class="body"><tspan x="18">They become neutral</tspan><tspan x="18" dy="21">metadata: path, media</tspan><tspan x="18" dy="21">type, and byte length.</tspan></text></g>
  <g transform="translate(1270 190)"><rect width="250" height="240" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="2"/><text x="18" y="32" class="eyebrow" fill="#059669">LATER AUTHORING</text><text x="18" y="76" class="cardtitle"><tspan x="18">Written observations</tspan><tspan x="18" dy="23">remain</tspan></text><text x="18" y="145" class="body"><tspan x="18">Earlier assistant messages</tspan><tspan x="18" dy="21">are replayed, so the model</tspan><tspan x="18" dy="21">can use them without pixels.</tspan></text></g>
  <rect x="45" y="520" width="555" height="315" rx="14" fill="#FFF" stroke="#BFDBFE" stroke-width="2"/>
  <text x="70" y="566" class="paneltitle" fill="#1D4ED8">REQUEST 3 — pixels still present</text>
  <rect x="75" y="590" width="500" height="60" rx="10" fill="#DBEAFE" stroke="#60A5FA"/><text x="90" y="616" class="stacktitle" fill="#1E3A8A">Image file part</text><text x="90" y="638" class="stackbody" fill="#1E3A8A">[1.4 MB of pixels]</text>
  <rect x="75" y="665" width="500" height="60" rx="10" fill="#D1FAE5" stroke="#34D399"/><text x="90" y="691" class="stacktitle" fill="#064E3B">Assistant observations</text><text x="90" y="713" class="stackbody" fill="#064E3B">“dark terminal UI, acid-green accent…”</text>
  <rect x="75" y="740" width="500" height="55" rx="10" fill="#F3F4F6" stroke="#D1D5DB"/><text x="90" y="773" class="stackbody" fill="#4B5563">Tool calls + user messages + provider metadata</text>
  <path d="M600 678 H642" fill="none" stroke="#8B5CF6" stroke-width="3" marker-end="url(#arrowPurple)"/><ellipse cx="727" cy="670" rx="77" ry="60" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="2"/><text x="727" y="652" text-anchor="middle" class="stacktitle" fill="#5B21B6"><tspan x="727">After 3 completed</tspan><tspan x="727" dy="21">model calls</tspan></text><text x="727" y="704" text-anchor="middle" class="small" fill="#6B7280">evict pixels</text><path d="M804 678 H847" fill="none" stroke="#8B5CF6" stroke-width="3" marker-end="url(#arrowPurple)"/>
  <rect x="855" y="520" width="700" height="315" rx="14" fill="#FFF" stroke="#A7F3D0" stroke-width="2"/>
  <text x="880" y="566" class="paneltitle" fill="#047857">REQUEST 4+ — pixels gone, meaning retained</text>
  <rect x="885" y="590" width="640" height="60" rx="10" fill="#F3F4F6" stroke="#D1D5DB"/><text x="900" y="616" class="stacktitle" fill="#374151">Neutral image reference</text><text x="900" y="638" class="stackbody" fill="#374151">{ path, mediaType, byteLength }</text>
  <rect x="885" y="665" width="640" height="60" rx="10" fill="#D1FAE5" stroke="#34D399" stroke-width="2"/><text x="900" y="691" class="stacktitle" fill="#064E3B">Assistant observations — unchanged</text><text x="900" y="713" class="stackbody" fill="#064E3B">“dark terminal UI, acid-green accent…”</text>
  <rect x="885" y="740" width="640" height="55" rx="10" fill="#F5F3FF" stroke="#A78BFA" stroke-dasharray="6 5"/><text x="900" y="764" class="small" fill="#5B21B6"><tspan x="900">Gemini thought signature may also be replayed — opaque continuity,</tspan><tspan x="900" dy="18">not a trustworthy visual summary</tspan></text>
  <rect x="45" y="860" width="960" height="95" rx="14" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2"/><text x="66" y="893" class="body" fill="#78350F"><tspan font-weight="700">Important failure mode: </tspan><tspan>If the model never writes a complete visual summary, the missing details are</tspan><tspan x="66" dy="23">genuinely lost after eviction. Three turns create an opportunity to summarize; they are not a guarantee.</tspan></text>
  <rect x="1035" y="860" width="520" height="95" rx="14" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="2"/><text x="1055" y="886" class="stacktitle" fill="#7F1D1D">NOT the memory mechanism</text><text x="1055" y="909" class="small" fill="#7F1D1D"><tspan x="1055">Prompt cache → only cost/latency reuse</tspan><tspan x="1055" dy="18">Neutral metadata → identity, not visual meaning</tspan><tspan x="1055" dy="18">Hidden session → none; the API call is stateless</tspan></text>
</svg>
