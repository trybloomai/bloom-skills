<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs><filter id="s" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#111827" flood-opacity=".1"/></filter><marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#9CA3AF"/></marker><marker id="ap" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#8B5CF6"/></marker><style>text{font-family:Inter,Arial,sans-serif}.title{font-size:30px;font-weight:700;fill:#111827}.sub{font-size:16px;fill:#6B7280}.eye{font-size:12px;font-weight:700;letter-spacing:.4px}.ct{font-size:16px;font-weight:700;fill:#111827}.body{font-size:14px;fill:#4B5563}.pt{font-size:17px;font-weight:700}.copy{font-size:15px}</style></defs>
  <rect width="1600" height="900" fill="#F7F8FC"/><text x="60" y="63" class="title">Observed behavior — not a hypothetical</text><text x="62" y="99" class="sub">Neutral three-turn eviction experiment · trial 610332 · eight source images</text>
  <rect x="45" y="125" width="1510" height="280" rx="14" fill="#FFF" stroke="#E5E7EB" filter="url(#s)"/><text x="70" y="162" class="eye" fill="#7C3AED">ACTUAL REQUEST SEQUENCE</text>
  <path d="M275 270H315" stroke="#9CA3AF" stroke-width="2" marker-end="url(#ag)"/><path d="M525 270H565" stroke="#9CA3AF" stroke-width="2" marker-end="url(#ag)"/><path d="M775 270H815" stroke="#8B5CF6" stroke-width="3" marker-end="url(#ap)"/><path d="M1025 270H1065" stroke="#9CA3AF" stroke-width="2" marker-end="url(#ag)"/><path d="M1275 270H1315" stroke="#9CA3AF" stroke-width="2" marker-end="url(#ag)"/>
  <g transform="translate(70 195)"><rect width="205" height="150" rx="13" fill="#EFF6FF" stroke="#93C5FD" stroke-width="2"/><text x="16" y="28" class="eye" fill="#2563EB">REQUEST 2</text><text x="102" y="75" text-anchor="middle" class="ct">view_files</text><text x="102" y="101" text-anchor="middle" class="body">8 source images</text></g>
  <g transform="translate(320 195)"><rect width="205" height="150" rx="13" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="2"/><text x="16" y="28" class="eye" fill="#059669">REQUEST 3</text><text x="102" y="73" text-anchor="middle" class="ct"><tspan x="102">Writes an 8-image</tspan><tspan x="102" dy="22">breakdown</tspan></text></g>
  <g transform="translate(570 195)"><rect width="205" height="150" rx="13" fill="#EFF6FF" stroke="#93C5FD" stroke-width="2"/><text x="16" y="28" class="eye" fill="#2563EB">REQUESTS 3–5</text><text x="102" y="75" text-anchor="middle" class="ct">Pixels present</text><text x="102" y="101" text-anchor="middle" class="body">1,616,365 B</text></g>
  <g transform="translate(820 195)"><rect width="205" height="150" rx="13" fill="#F5F3FF" stroke="#A78BFA" stroke-width="2"/><text x="16" y="28" class="eye" fill="#7C3AED">REQUEST 6</text><text x="102" y="75" text-anchor="middle" class="ct">Pixels evicted</text><text x="102" y="101" text-anchor="middle" class="body">12,506 B · −99.2%</text></g>
  <g transform="translate(1070 195)"><rect width="205" height="150" rx="13" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="2"/><text x="16" y="28" class="eye" fill="#059669">REQUEST 9</text><text x="102" y="73" text-anchor="middle" class="ct"><tspan x="102">Recites all 8</tspan><tspan x="102" dy="22">from prior text</tspan></text></g>
  <g transform="translate(1320 195)"><rect width="205" height="150" rx="13" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="2"/><text x="16" y="28" class="eye" fill="#059669">REQUEST 10+</text><text x="102" y="75" text-anchor="middle" class="ct">Authors + passes</text><text x="102" y="101" text-anchor="middle" class="body">0 source reopens</text></g>
  <rect x="45" y="435" width="1510" height="215" rx="14" fill="#FFF" stroke="#E5E7EB"/><text x="75" y="472" class="eye" fill="#2563EB">REQUEST 3 · WHILE PIXELS WERE PRESENT</text><text x="870" y="472" class="eye" fill="#059669">REQUEST 9 · THREE REQUESTS AFTER EVICTION</text>
  <rect x="70" y="490" width="660" height="125" rx="12" fill="#EFF6FF" stroke="#BFDBFE"/><text x="90" y="526" class="copy" fill="#1E3A8A"><tspan x="90">“moodboard-01: A heart-shaped hand gesture…”</tspan><tspan x="90" dy="24">“moodboard-02: A simple serif-font wordmark ‘David™’…”</tspan><tspan x="90" dy="24">…then describes moodboards 03–08.</tspan></text>
  <path d="M730 553H857" stroke="#8B5CF6" stroke-width="3" marker-end="url(#ap)"/><rect x="745" y="520" width="100" height="52" rx="8" fill="#FFF"/><text x="795" y="540" text-anchor="middle" class="eye" fill="#6D28D9"><tspan x="795">same text</tspan><tspan x="795" dy="17">survives</tspan></text>
  <rect x="865" y="490" width="660" height="125" rx="12" fill="#ECFDF5" stroke="#A7F3D0"/><text x="885" y="522" class="copy" fill="#064E3B"><tspan x="885">“Let’s refresh our memory of what each image looked like.”</tspan><tspan x="885" dy="28">It then recites heart-hands, David™, white square, blue chart,</tspan><tspan x="885" dy="22">Koncilio, Madewell.ai, ‘25, and Zapier.</tspan></text>
  <rect x="45" y="680" width="720" height="165" rx="14" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="2"/><text x="68" y="715" class="pt" fill="#7F1D1D">But this does not establish reliable visual memory.</text><text x="68" y="750" class="copy" fill="#7F1D1D"><tspan x="68">A separate passing run (610333) omitted both colors and typography</tspan><tspan x="68" dy="23">relative to baseline. Another run produced only a broad synthesis.</tspan><tspan x="68" dy="23">It remembered enough to finish—not necessarily every important detail.</tspan></text>
  <rect x="795" y="680" width="760" height="165" rx="14" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2"/><text x="818" y="715" class="pt" fill="#78350F">Safe conclusion</text><text x="818" y="750" class="copy" fill="#78350F"><tspan x="818">Do not depend on spontaneous free-form summarization. Evict only after</tspan><tspan x="818" dy="23">a structured visual-memory checkpoint is present and validated;</tspan><tspan x="818" dy="23">otherwise retain or reopen the original image for detail-sensitive work.</tspan></text>
</svg>
